name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Test & Lint Backend
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compile Check
        working-directory: ./backend
        run: |
          python -m compileall app/

  # ─────────────────────────────────────────────────────────────
  # Job 2: Lint & Build Frontend
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter (Oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript & Vite Build Check
        working-directory: ./frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to Render (Triggered on main push if secrets exist)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deployment
        if: env.RENDER_BACKEND_HOOK != ''
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Backend Deploy Hook on Render..."
          curl -s -X POST "$RENDER_BACKEND_HOOK"

      - name: Trigger Frontend Deployment
        if: env.RENDER_FRONTEND_HOOK != ''
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Frontend Deploy Hook on Render..."
          curl -s -X POST "$RENDER_FRONTEND_HOOK"
